name: Build PhoneGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android APK
        run: gradle --no-daemon :android-app:assembleDebug
      - name: Build Windows EXE
        shell: pwsh
        run: ./windows-app/build.ps1
      - name: Gather install files
        shell: pwsh
        run: Copy-Item android-app/build/outputs/apk/debug/android-app-debug.apk dist/PhoneGuard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-Windows-Android
          path: |
            dist/PhoneGuard.exe
            dist/PhoneGuard.apk

